stages:
  - test
  - deploy

tests:python:
  stage: test
  image: python:3
  except:
    - tags
  services:
    - postgres:9
  variables:
    AUTH_STRATEGY: auth_local_no_password
    DB_HOST: postgres
    POSTGRES_DB: zoudb
    POSTGRES_PASSWORD: mysecretpassword
    POSTGRES_USER: postgres
  script:
    # Create thumbnail folder
    - export PREVIEW_FOLDER=$(pwd)/data  # Note: ABSOLUTE path required
    - mkdir -p $PREVIEW_FOLDER

    # Install pg_dump
    - apt-get update
    - apt-get install postgresql-client --yes

    # Install requirements
    - pip install -r requirements.txt

    # Run Tests
    - PYTHONPATH=. py.test --ignore=tests/auth/test_auth_route.py
  tags:
    - test


stack_deploy:
  stage: deploy
  only:
    - tags
  tags:
    - docker-swarm
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker build --pull --cache-from $CI_REGISTRY_IMAGE:latest --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA --tag $CI_REGISTRY_IMAGE:latest --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
